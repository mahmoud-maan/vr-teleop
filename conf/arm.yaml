# vr_teleop — single arm configuration.
# Copy / edit to match your hardware. Pass with `-c conf/arm.yaml` (default).

robot:
  id: single_arm
  fps: 30
  use_rerun: false       # set to true to mirror obs+action into the Rerun viewer
  reset_duration_s: 1.5  # gentle ramp to home on Reset (seconds). 0 = instant.

# Optional: declare cameras here, then list them under arms.<side>.cameras.
cameras:
  wrist:
    index: 2
    width: 640
    height: 480
#   main:
#     index: 1
#     width: 640
#     height: 480

arms:
  right:                 # change to "left" if you grip with your left controller
    type: so100
    port: /dev/ttyACM1
    use_degrees: true
    cameras: [wrist]          # which declared cameras are attached to this arm
    regularization: 1.0e-3
    end_effector_step_sizes: { x: 0.8, y: 0.8, z: 0.8 }
    end_effector_bounds:
      min: [-1.0, -1.0, -1.0]
      max: [ 1.0,  1.0,  1.0]
    max_ee_step_m: 0.20
    gripper_speed_factor: 20.0

transport:
  host: 0.0.0.0
  port: 8080             # WebSocket port the Godot client streams FramePackets to

camera_server:
  host: 0.0.0.0
  port: 8765             # MJPEG/HTTP port the Godot client pulls camera streams from
  jpeg_quality: 80
  fps: 30

# Uncomment to enable episode recording to a LeRobot dataset.
# dataset:
#   repo_id: "<YOUR_HF_USERNAME>/vr_test_single_arm"
#   single_task: "Grab the cube"
#   push_to_hub: false   # set to true to push on Save Dataset
#   # root: "./datasets" # optional: override dataset storage path
#   # vcodec: "h264"     # default (software libx264, CPU). Other allowed values:
#                        #   "hevc"               software HEVC/x265
#                        #   "libsvtav1"          software AV1
#                        #   "h264_nvenc"/"hevc_nvenc"  NVIDIA HW
#                        #   "h264_qsv"           Intel QuickSync
#                        #   "h264_vaapi"         Intel/AMD VAAPI
#                        #   "h264_videotoolbox"/"hevc_videotoolbox"  macOS HW
#                        #   "auto"               let FFmpeg pick (avoid: picks
#                        #                        NVENC on any NVIDIA driver).

dataset:
  repo_id: "maan/vr_wrist_test"          # owner/name; folder name on disk
  single_task: "Pick the red cube and put it in the bin"       # human description of what you're recording
  push_to_hub: false                     # set to true later if you want to publish
  root: "./datasets"
# vr_teleop — dual-arm configuration.
# Both arms must be defined as "left" and "right".

robot:
  id: dual_arm
  fps: 30
  use_rerun: false
  reset_duration_s: 1.5

# Optional: declare cameras here, then list them under each arm's cameras.
cameras:
  left_wrist:
    index: 2
    width: 640
    height: 480
#   right_wrist:
#     index: 0
#     width: 640
#     height: 480
#   main:
#     index: 2
#     width: 640
#     height: 480

arms:
  left:
    type: so100
    port: /dev/ttyACM1
    use_degrees: true
    cameras: [left_wrist]
    regularization: 1.0e-3
    end_effector_step_sizes: { x: 0.8, y: 0.8, z: 0.8 }
    end_effector_bounds:
      min: [-1.0, -1.0, -1.0]
      max: [ 1.0,  1.0,  1.0]
    max_ee_step_m: 0.20
    gripper_speed_factor: 20.0

  right:
    type: so100
    port: /dev/ttyACM0
    use_degrees: true
    cameras: []
    regularization: 1.0e-3
    end_effector_step_sizes: { x: 0.8, y: 0.8, z: 0.8 }
    end_effector_bounds:
      min: [-1.0, -1.0, -1.0]
      max: [ 1.0,  1.0,  1.0]
    max_ee_step_m: 0.20
    gripper_speed_factor: 20.0

transport:
  host: 0.0.0.0
  port: 8080

camera_server:
  host: 0.0.0.0
  port: 8765
  jpeg_quality: 80
  fps: 30

# Uncomment to enable episode recording to a LeRobot dataset.
# dataset:
#   repo_id: "<YOUR_HF_USERNAME>/vr_test_dual_arm"
#   single_task: "Grab the cube"
#   push_to_hub: false
